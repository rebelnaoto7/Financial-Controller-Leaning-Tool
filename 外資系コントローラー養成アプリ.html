<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>外資系コントローラー養成アプリ</title>
<script>
  (() => {
    const param = new URLSearchParams(window.location.search).get("theme");
    const theme =
      param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<script>
  (() => {
    try {
      if (new URLSearchParams(window.location.search).get("theme")) return;
      const saved = localStorage.getItem("learn-ui:theme");
      if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
    } catch (e) { /* storage unavailable */ }
  })();
</script>
<style>

  color-scheme: light;

  --cp-accent-hover: #9a1a41;
  --cp-accent-soft: rgba(177, 31, 75, 0.08);

  --cp-text: #dedede;

  --cp-text-soft: #b0b0b0;

  --cp-accent-soft: rgba(253, 142, 161, 0.14);

  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #4da6ff;
  --cp-shadow: 0 18px 48px rgba(0, 0, 0, 0.32);
  --cp-overlay: rgba(41, 41, 41, 0.88);
  --cp-panel: rgba(41, 41, 41, 0.72);

* { box-sizing: border-box; }

}

}

}

}

.btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--cp-accent); cursor: pointer;
  background: var(--cp-accent); color: var(--cp-accent-fg); border-radius: .625rem; padding: 7px 16px; font-weight: 600; font-size: 0.9375rem;

.fb { margin-top: 8px; font-size: 0.9375rem; color: var(--cp-text-muted); display: none; }

.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 6px; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }

.switches { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.sw {
  display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--cp-border); border-radius: .625rem; padding: 8px 10px; cursor: pointer; background: var(--cp-surface); font-size: 0.875rem; line-height: 1.4;
}

.cbars .row { display: grid; grid-template-columns: 150px 1fr 96px; gap: 10px; align-items: center; margin: 4px 0; font-size: 0.875rem; }
.cbars .track { position: relative; height: 18px; background: var(--cp-surface-soft); border-radius: 6px; overflow: hidden; }

.region { margin: 12px 0 4px; font-weight: 700; color: var(--cp-text-muted); font-size: 0.875rem; }
.cc { display: flex; gap: 10px; align-items: flex-start; }
.code {
  flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
  font-weight: 800; font-size: 0.84375rem; background: var(--cp-surface-soft); border: 1px solid var(--cp-border); color: var(--cp-text);
}
.tile.sel { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
.tl { position: relative; margin-left: 10px; padding-left: 20px; border-left: 2px solid var(--cp-border); }
.tl .it { position: relative; margin: 0 0 12px; }

.search { width: 100%; padding: 9px 12px; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-surface); }
.bigscore { font-size: 2.75rem; font-weight: 800; color: var(--cp-accent); font-variant-numeric: tabular-nums; }

.check-ng { color: var(--cp-danger); font-weight: 700; }

.wf .blk { position: absolute; top: 0; bottom: 0; border-radius: 4px; transition: all .35s; }
.note { font-size: 0.84375rem; color: var(--cp-text-muted); }
.hide { display: none !important; }
@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  nav.side { position: static; height: auto; display: flex; flex-wrap: wrap; gap: 4px; border-right: 0; border-bottom: 1px solid var(--cp-border); }
  nav.side .grp { display: none; }
  nav.side button { width: auto; }

}

.quiz.rp .q::before { content: "ロールプレイ"; }
.flip .en { display: none; margin-top: 8px; font-size: 14.5px; font-weight: 600; color: var(--cp-accent); }

<style id="readability">

:root {
  --x-ink: #1c1917;
  --x-ink-2: #2a2623;
  --x-card: #f4f4f2;
  --x-orange: #fb8619;
  --x-orange-2: #fb4a19;
  --x-grad: linear-gradient(90deg, #fb8619 0%, #fb4a19 100%);
  --x-cta: linear-gradient(90deg, #f26b0f 0%, #e0400e 100%);
  --x-lime: #c6f23a;
  --x-violet: #7b3fe4;
  --x-edge: #1c1917;
  --x-edge-soft: rgba(28, 25, 23, 0.14);
  --x-page: #f7f7f5;
  --x-side: #eeeeeb;
  --x-grid: rgba(28, 25, 23, 0.06);
  --x-grid-side: rgba(28, 25, 23, 0.075);
  --x-hdr: #1c1917;
  --x-box-bg: #1c1917;
  --x-box-fg: #ffffff;
  --x-font: "XDash", "Segoe UI", "Noto Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "BIZ UDPGothic", "Yu Gothic UI", Meiryo, sans-serif;
  --x-en: "XDisplay", "XDash", "Segoe UI", "Noto Sans JP", "Hiragino Sans", "BIZ UDPGothic", "Yu Gothic UI", Meiryo, sans-serif;
  --x-mono: "Cascadia Mono", Consolas, "SFMono-Regular", Menlo, monospace;

  --cp-bg: #f7f7f5;
  --cp-bg-elevated: #f4f4f2;
  --cp-surface: #ffffff;
  --cp-surface-soft: #f4f4f2;
  --cp-border: #dbd8d4;
  --cp-border-strong: #8c857e;
  --cp-text: #1c1917;
  --cp-text-muted: #5c5752;
  --cp-text-soft: #6b6661;
  --cp-accent: #c2410c;
  --cp-accent-hover: #9a3412;
  --cp-accent-soft: rgba(251, 134, 25, 0.12);
  --cp-accent-fg: #ffffff;
  --cp-success: #15803d;
  --cp-danger: #dc2626;
  --cp-warning: #f59e0b;
  --cp-link: #2563eb;
  --cp-shadow: 0 14px 34px rgba(28, 25, 23, 0.16);
  --cp-overlay: rgba(255, 255, 255, 0.86);
  --cp-panel: rgba(255, 255, 255, 0.88);
  --cp-panel-strong: rgba(255, 255, 255, 0.97);
  --cp-sheen: rgba(255, 255, 255, 0.55);
  --cp-highlight: rgba(251, 134, 25, 0.16);
}
html[data-theme="dark"] {
  --x-edge: #5f5851;
  --x-edge-soft: rgba(255, 255, 255, 0.14);
  --x-page: #1c1917;
  --x-side: #161311;
  --x-grid: rgba(255, 255, 255, 0.045);
  --x-grid-side: rgba(255, 255, 255, 0.05);
  --x-hdr: #0f0d0c;
  --x-box-bg: #f4f4f2;
  --x-box-fg: #1c1917;

  --cp-bg: #1c1917;
  --cp-bg-elevated: #211d1a;
  --cp-surface: #2a2623;
  --cp-surface-soft: #34302c;
  --cp-border: #4a443e;
  --cp-border-strong: #7d766f;
  --cp-text: #f4f4f2;
  --cp-text-muted: #c9c3bc;
  --cp-text-soft: #b1aaa2;
  --cp-accent: #fb8619;
  --cp-accent-hover: #ffa54f;
  --cp-accent-soft: rgba(251, 134, 25, 0.15);
  --cp-accent-fg: #1c1917;
  --cp-success: #4ade80;
  --cp-danger: #f87171;
  --cp-warning: #fbbf24;
  --cp-link: #6ea8ff;
  --cp-shadow: 0 14px 34px rgba(0, 0, 0, 0.5);
  --cp-overlay: rgba(28, 25, 23, 0.9);
  --cp-panel: rgba(42, 38, 35, 0.82);
  --cp-panel-strong: rgba(42, 38, 35, 0.97);
  --cp-sheen: rgba(255, 255, 255, 0.04);
  --cp-highlight: rgba(251, 134, 25, 0.2);
}

/* ---------- 土台：方眼紙 ---------- */
body {
  font-family: var(--x-font);
  background-color: var(--x-page);
  background-image:
    linear-gradient(to right, var(--x-grid) 1px, transparent 1px),
    linear-gradient(var(--x-grid) 1px, transparent 1px);
  background-size: 24px 24px;
  font-synthesis: weight;
}
::selection { background: var(--x-lime); color: var(--x-ink); }
:focus-visible { outline: 3px solid var(--x-orange-2); outline-offset: 2px; }


/* ============ デザインレイヤー：学習アプリの部品（5つの学習アプリ共通） ============ */
/* ---------- ヘッダー：黒いバー＋読み進めたぶんだけ伸びるオレンジの線 ---------- */
header.top {
  background: var(--x-hdr);
  color: #fff;
  border-bottom: 0;
  min-height: 64px;
  padding: 10px 22px;
  gap: 18px;
}
header.top::after {
  content: "";
  position: absolute; left: 0; right: 0; bottom: -4px; height: 4px; pointer-events: none;
  background: var(--x-grad) 0 0 / calc(var(--x-read, 0) * 100%) 100% no-repeat, #3a3531;
}
html[data-theme="dark"] header.top::after { background: var(--x-grad) 0 0 / calc(var(--x-read, 0) * 100%) 100% no-repeat, #2f2a26; }
.logo {
  width: 42px; height: 42px; border-radius: 13px;
  background: var(--x-grad); color: var(--x-ink);
  font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 1.2rem;
  box-shadow: inset 0 0 0 2px rgba(28, 25, 23, 0.18);
}
.brand { color: #fff; font-weight: 800; letter-spacing: 0.03em; display: flex; flex-direction: column; justify-content: center; }
.brand .x-en {
  display: block; font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 0.75rem;
  letter-spacing: 0.06em; line-height: 1.1; color: #fff; text-transform: uppercase; margin-bottom: 2px;
}
.brand .x-en em { font-style: italic; color: var(--x-orange); }
.brand small { display: none; }
header.top .prog { gap: 12px; }
header.top .bar { height: 10px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.28); }
header.top .bar > i { background: var(--x-grad); border-radius: 99px; }
header.top .prog span { color: rgba(255, 255, 255, 0.82); font-weight: 700; font-variant-numeric: tabular-nums; }
header.top .iconbtn, header.top .fsz button {
  background: transparent; color: #fff; border: 1.5px solid rgba(255, 255, 255, 0.34); border-radius: 999px;
  padding: 5px 13px; font-weight: 700;
}
header.top .iconbtn:hover, header.top .fsz button:hover { border-color: var(--x-orange); color: var(--x-orange); background: transparent; }
header.top .fsz button.on, header.top .fsz button.on:hover { background: #fff; border-color: #fff; color: var(--x-ink); }
header.top .fsz .lab { color: rgba(255, 255, 255, 0.72); }
header.top :focus-visible { outline-color: var(--x-orange); }

/* ---------- 目次：INDEX ---------- */
nav.side {
  background-color: var(--x-side);
  background-image:
    linear-gradient(to right, var(--x-grid-side) 1px, transparent 1px),
    linear-gradient(var(--x-grid-side) 1px, transparent 1px);
  background-size: 24px 24px;
  border-right: 2px solid var(--x-edge);
  padding: 18px 12px 48px;
  counter-reset: xidx;
}
nav.side::before {
  content: "INDEX"; display: block; margin: 4px 10px 8px;
  font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 2rem; line-height: 1; letter-spacing: -0.01em;
  color: var(--cp-text);
}
nav.side .grp {
  display: flex; align-items: center; gap: 8px;
  margin: 20px 10px 6px; color: var(--cp-accent);
  font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em;
}
nav.side .grp::before { content: ""; flex: 0 0 auto; width: 16px; height: 2px; background: currentColor; }
html[data-theme="dark"] nav.side .grp { color: var(--cp-accent); }
@media (min-width: 981px) {
  .layout { grid-template-columns: 304px minmax(0, 1fr); }
  body .share-note { left: calc(50% + 152px); }
}
@media (min-width: 981px) and (max-width: 1279px) {
  .layout { grid-template-columns: 272px minmax(0, 1fr); }
  body .share-note { left: calc(50% + 136px); }
}
nav.side button {
  counter-increment: xidx;
  display: grid; grid-template-columns: 1.6em auto minmax(0, 1fr) auto; align-items: center; gap: 7px;
  margin: 2px 0; padding: 8px 10px; border: 2px solid transparent; border-radius: 12px;
  color: var(--cp-text-muted); font-weight: 600; transition: background .15s, border-color .15s, color .15s;
}
nav.side button::before {
  content: counter(xidx, decimal-leading-zero);
  font-family: var(--x-mono); font-size: 0.6875rem; font-weight: 700; color: var(--cp-text-soft); letter-spacing: 0;
}
nav.side button:hover { background: var(--cp-surface); color: var(--cp-text); }
nav.side button.active {
  background: var(--cp-surface); border-color: var(--x-edge); color: var(--cp-text); font-weight: 800;
  box-shadow: 3px 3px 0 var(--x-edge);
}
nav.side button.active::before { color: var(--x-orange-2); }
nav.side .tag {
  min-width: 44px; border-radius: 999px; border: 1.5px solid var(--cp-border); background: var(--cp-surface);
  color: var(--cp-text-muted); font-size: 0.6875rem; font-weight: 800; padding: 1px 6px; letter-spacing: 0.02em;
}
nav.side button.active .tag { background: var(--x-ink); border-color: var(--x-ink); color: #fff; }
html[data-theme="dark"] nav.side button.active .tag { background: var(--x-orange); border-color: var(--x-orange); color: var(--x-ink); }
nav.side .ck {
  display: grid; place-items: center; width: 20px; height: 20px; border-radius: 50%;
  background: var(--cp-success); color: #fff; font-size: 0.6875rem; font-weight: 900; line-height: 1;
}
html[data-theme="dark"] nav.side .ck { color: var(--x-ink); }

/* ---------- 本文 ---------- */
main { padding: 32px 42px 110px; }
@media (min-width: 981px) and (max-width: 1279px) { main { padding-left: 28px; padding-right: 28px; } }
.kicker {
  display: inline-flex; align-items: center; gap: 10px;
  color: var(--cp-accent); font-family: var(--x-en); font-style: italic; font-weight: 900;
  font-size: 0.8125rem; letter-spacing: 0.14em; text-transform: uppercase;
}
.kicker::before, .kicker::after { content: ""; width: 24px; height: 2px; background: currentColor; }
main h1 { font-weight: 900; letter-spacing: 0.01em; font-size: clamp(1.6rem, 1.15rem + 1.1vw, 2.125rem); margin: 8px 0 12px; }
main > h2, main > .lroot > h2, .card > h2 { position: relative; padding-left: 16px; font-weight: 900; }
main > h2::before, main > .lroot > h2::before, .card > h2::before {
  content: ""; position: absolute; left: 0; top: 0.22em; bottom: 0.22em; width: 6px; border-radius: 3px; background: var(--x-grad);
}
main > h2, main > .lroot > h2 { margin-top: 30px; }
h3 { font-weight: 800; }
.lead { color: var(--cp-text-muted); }
main a { color: var(--cp-link); font-weight: 600; }

/* カード：2pxの黒い枠＋大きめの角丸 */
.card {
  background: var(--cp-surface); border: 2px solid var(--x-edge); border-radius: 22px;
  padding: 22px 26px; margin: 20px 0; box-shadow: none;
}
.tile {
  background: var(--cp-surface); border: 2px solid var(--cp-border); border-radius: 18px; box-shadow: none;
  transition: transform .15s, box-shadow .15s, border-color .15s;
}
.tile .t { font-weight: 800; }
.tile.click { border-color: var(--x-edge); }
.tile.click:hover { border-color: var(--x-edge); transform: translateY(-3px); box-shadow: 0 5px 0 var(--x-edge); }
.tile.sel { border-color: var(--x-orange-2); background: var(--cp-accent-soft); box-shadow: 0 0 0 2px var(--x-orange-2) inset; }
.kpi, .ma-kpi, .sb-kpi, .m10-kpi {
  background: var(--cp-surface); border: 2px solid var(--x-edge); border-radius: 18px;
}
.kpi .v, .ma-kpi .v, .sb-kpi .v, .m10-kpi .v, .bigscore {
  font-family: var(--x-en), var(--x-font); font-weight: 800; letter-spacing: -0.005em;
}
.bigscore {
  font-style: italic; font-weight: 900; font-size: 3.4rem; line-height: 1.15;
  background: var(--x-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}
/* KPIの箱：入る数だけ横に並べ、細い箱では数字を途中で折り返さずに文字を小さくする */
.kpis, .ma-kpis, .ma-kpis.k4, .sb-kpis, .m10-kpis { grid-template-columns: repeat(auto-fit, minmax(min(132px, 100%), 1fr)); }
.kpis > .kpi, .ma-kpis > .ma-kpi, .sb-kpis > .sb-kpi, .m10-kpis > .m10-kpi { container-type: inline-size; }
@container (max-width: 220px) {
  .kpi .v, .ma-kpi .v, .sb-kpi .v, .m10-kpi .v { font-size: clamp(0.95rem, 13cqi, 1.5rem); overflow-wrap: anywhere; letter-spacing: -0.01em; }
}

/* ゴール：枠に乗ったラベル */
.goal {
  position: relative; background: var(--cp-surface); border: 2px solid var(--x-edge); border-radius: 16px;
  padding: 22px 22px 14px; margin: 26px 0 18px;
}
.goal::before {
  content: "GOAL"; position: absolute; top: -0.85em; left: 18px; padding: 1px 12px; border-radius: 999px;
  background: var(--x-ink); color: #fff; font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 0.75rem; letter-spacing: 0.14em; line-height: 1.5;
}
html[data-theme="dark"] .goal::before { background: var(--x-orange); color: var(--x-ink); }
.goal b { color: var(--cp-text); background: linear-gradient(transparent 60%, rgba(198, 242, 58, 0.85) 60%); }
html[data-theme="dark"] .goal b { background: none; color: var(--x-lime); }

/* ポイント：ライムのラベル */
.analogy {
  background: var(--cp-surface-soft); border-left: 5px solid var(--x-orange); border-radius: 6px 16px 16px 6px; padding: 14px 18px;
}
.analogy .lab {
  display: block; width: fit-content; max-width: 100%; background: var(--x-lime); color: var(--x-ink);
  padding: 0 10px; border-radius: 6px; margin-bottom: 6px; font-weight: 900;
}

/* メンター・CFOのひとこと：ターミナル風のウィンドウ */
.cfo {
  position: relative; overflow: hidden; background: var(--cp-surface); border: 2px solid var(--x-edge);
  border-radius: 18px; padding: 48px 22px 18px; margin: 22px 0;
}
.cfo::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 32px;
  background:
    radial-gradient(circle at 18px 16px, #ff5f57 0 5px, transparent 5.5px),
    radial-gradient(circle at 36px 16px, #febc2e 0 5px, transparent 5.5px),
    radial-gradient(circle at 54px 16px, #28c840 0 5px, transparent 5.5px),
    var(--x-ink);
}
.cfo::after {
  content: "voice.md"; position: absolute; top: 7px; left: 72px;
  font-family: var(--x-mono); font-size: 12px; line-height: 18px; color: rgba(255, 255, 255, 0.72);
}
html[data-theme="dark"] .cfo::before { background:
    radial-gradient(circle at 18px 16px, #ff5f57 0 5px, transparent 5.5px),
    radial-gradient(circle at 36px 16px, #febc2e 0 5px, transparent 5.5px),
    radial-gradient(circle at 54px 16px, #28c840 0 5px, transparent 5.5px),
    #0f0d0c; }
.cfo .lab { color: var(--cp-text); font-weight: 900; font-size: 0.9375rem; }
.cfo .lab::before {
  background: var(--x-grad); color: var(--x-ink); border-radius: 999px; padding: 0 10px;
  font-family: var(--x-en); font-style: italic; font-weight: 900; letter-spacing: 0.04em;
}

/* 確認問題 */
.quiz { background: var(--cp-surface); border: 2px solid var(--x-edge); border-radius: 20px; padding: 20px 22px; }
.quiz .q::before { background: var(--x-ink); color: #fff; border-radius: 999px; padding: 1px 11px; font-weight: 800; }
html[data-theme="dark"] .quiz .q::before { background: var(--x-orange); color: var(--x-ink); }
.opt {
  border: 2px solid var(--cp-border); border-radius: 14px; background: var(--cp-surface); font-weight: 600;
  transition: border-color .15s, transform .15s, box-shadow .15s;
}
.opt:hover { border-color: var(--x-edge); transform: translateY(-1px); box-shadow: 0 3px 0 var(--x-edge); }
.opt.right { border-color: var(--cp-success); background: color-mix(in srgb, var(--cp-success) 10%, var(--cp-surface)); box-shadow: none; transform: none; }
.opt.wrong { border-color: var(--cp-danger); background: color-mix(in srgb, var(--cp-danger) 8%, var(--cp-surface)); box-shadow: none; transform: none; }
.fb.show { border-top: 2px dashed var(--cp-border); padding-top: 10px; margin-top: 12px; }

/* ボタン：ふだんは黒いピル、いちばん大事な1つだけオレンジ */
.btn {
  border: 2px solid var(--x-ink); background: var(--x-ink); color: #fff; border-radius: 999px;
  padding: 8px 20px; font-weight: 800; letter-spacing: 0.02em;
  transition: transform .12s, box-shadow .15s, background .15s, border-color .15s;
}
.btn:hover { background: var(--x-ink-2); border-color: var(--x-ink-2); box-shadow: 0 0 0 3px rgba(251, 134, 25, 0.45); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--cp-surface); color: var(--cp-text); border-color: var(--x-edge); }
.btn.ghost:hover { background: var(--cp-surface-soft); box-shadow: 0 3px 0 var(--x-edge); }
.btn:disabled, .btn:disabled:hover { box-shadow: none; transform: none; }
html[data-theme="dark"] .btn { background: var(--x-orange); border-color: var(--x-orange); color: var(--x-ink); }
html[data-theme="dark"] .btn:hover { background: #ffa54f; border-color: #ffa54f; box-shadow: 0 0 0 3px rgba(251, 134, 25, 0.3); }
html[data-theme="dark"] .btn.ghost { background: var(--cp-surface); color: var(--cp-text); border-color: var(--x-edge); }
html[data-theme="dark"] .btn.ghost:hover { background: var(--cp-surface-soft); box-shadow: none; }

.btn.x-cta, .next-row .btn[data-complete] {
  background: var(--x-cta); color: #fff; border: 2.5px solid #fff;
  box-shadow: 0 0 0 2px #e0400e, 0 10px 22px rgba(224, 64, 14, 0.32);
  font-size: 1.1875rem; font-weight: 900; padding: 11px 14px 11px 26px; gap: 12px;
}
.btn.x-cta:hover, .next-row .btn[data-complete]:hover {
  background: linear-gradient(90deg, #e35f0a 0%, #c9370b 100%); border-color: #fff;
  box-shadow: 0 0 0 2px #c9370b, 0 12px 26px rgba(224, 64, 14, 0.4); transform: translateY(-1px);
}
html[data-theme="dark"] .btn.x-cta, html[data-theme="dark"] .next-row .btn[data-complete] { color: #fff; border-color: var(--x-page); }
.x-arrow {
  flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; background: #fff; position: relative;
}
.x-arrow::before {
  content: ""; position: absolute; left: 50%; top: 50%; width: 8px; height: 8px;
  border-top: 3px solid #e0400e; border-right: 3px solid #e0400e; transform: translate(-65%, -50%) rotate(45deg);
}
.next-row { border-top: 2px dashed var(--x-edge-soft); padding-top: 22px; margin-top: 40px; gap: 12px; }

.x-cta-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 18px; margin: 18px 0 8px; }
.x-cta-note { font-size: 0.875rem; color: var(--cp-text-muted); font-weight: 700; }
.x-cta-note b { font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 1.25rem; color: var(--cp-accent); margin: 0 2px; }

/* ピル・チップ・切り替え */
.pill { border-radius: 999px; border: 1.5px solid var(--cp-border); font-weight: 800; letter-spacing: 0.02em; padding: 1px 10px; }
.pill.acc { background: var(--cp-surface); border: 2px solid var(--x-edge); color: var(--cp-text); }
.pill.ok { background: var(--cp-success); border-color: var(--cp-success); color: #fff; }
html[data-theme="dark"] .pill.ok { color: var(--x-ink); }
.pill.warn { color: #b45309; border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
html[data-theme="dark"] .pill.warn { color: var(--cp-warning); }
.chip { border: 2px solid var(--x-edge); border-radius: 999px; background: var(--cp-surface); font-weight: 700; padding: 6px 16px; transition: background .15s; }
.chip:hover { background: var(--cp-surface-soft); }
.chip.sel { background: var(--x-ink); border-color: var(--x-ink); color: #fff; }
html[data-theme="dark"] .chip.sel { background: var(--x-orange); border-color: var(--x-orange); color: var(--x-ink); }
.seg { border: 2px solid var(--x-edge); border-radius: 999px; background: var(--cp-surface); padding: 3px; gap: 3px; }
.seg button { border-radius: 999px; padding: 6px 15px; font-weight: 700; background: transparent; }
.seg button + button { border-left: 0; }
.seg button.on { background: var(--x-ink); color: #fff; }
html[data-theme="dark"] .seg button.on { background: var(--x-orange); color: var(--x-ink); }
.sw { border: 2px solid var(--cp-border); border-radius: 14px; transition: border-color .15s, background .15s; }
.sw:hover { border-color: var(--x-edge); }
.sw.on { border-color: var(--x-edge); background: var(--cp-accent-soft); }
input[type=range] { accent-color: var(--x-orange-2); }
.search, .ma-cq input {
  border: 2px solid var(--x-edge); border-radius: 999px; padding: 10px 18px; background: var(--cp-surface);
}
.ma-cq input { border-radius: 10px; padding: 6px 10px; }
.search:focus, .ma-cq input:focus { outline: none; box-shadow: 0 0 0 4px rgba(251, 134, 25, 0.35); }

/* 表：見出しの行は黒 */
table.fs { border-top: 0; }
table.fs tr:first-child > th { background: var(--x-ink); color: #fff; border-bottom: 0; letter-spacing: 0.05em; }
table.fs tr:first-child > th:first-child { border-top-left-radius: 10px; }
table.fs tr:first-child > th:last-child { border-top-right-radius: 10px; }
html[data-theme="dark"] table.fs tr:first-child > th { background: #3a3531; color: #fff; }
table.fs tr:not(:first-child) > th { background: var(--cp-surface-soft); color: var(--cp-text); }
:where(table.fs) :where(tr:nth-child(even)) > td { background: rgba(28, 25, 23, 0.025); }
html[data-theme="dark"] :where(table.fs) :where(tr:nth-child(even)) > td { background: rgba(255, 255, 255, 0.025); }
table.fs tr.tot td { font-weight: 800; background: var(--cp-surface-soft); border-top: 2px solid var(--x-edge); }
table.fs tr.sec td { color: var(--cp-accent); border-bottom: 2px solid var(--x-orange); }
.journal th { border-bottom: 2px solid var(--x-edge); color: var(--cp-text); font-weight: 800; }
.journal td.acct { background: var(--cp-accent-soft); }
.tbl-wrap { border-radius: 10px; }

/* グラフ・図 */
.bar { height: 10px; border: 1.5px solid var(--x-edge-soft); }
.bar > i { background: var(--x-grad); border-radius: 99px; }
.hbar { border: 2px solid var(--x-edge); border-radius: 12px; height: 36px; }
.flow .st { border: 2px solid var(--x-edge); border-radius: 14px; background: var(--cp-surface); }
.flow .st b { color: var(--cp-accent); }
.flow .arr { color: var(--x-orange-2); font-size: 1.1rem; }
.tl { border-left: 2px dashed var(--x-edge); }
.tl .it::before { background: var(--x-grad); box-shadow: 0 0 0 2px var(--cp-bg), 0 0 0 4px var(--x-edge); }
.tl .d { font-weight: 800; }
.code { border: 2px solid var(--x-edge); border-radius: 12px; background: var(--cp-surface); font-weight: 900; }
.ma-card, .sb-card, .m10-card { border: 2px solid var(--x-edge); border-radius: 18px; }
.ma-card.best { border-color: var(--x-orange-2); box-shadow: 0 0 0 2px var(--x-orange-2) inset; }
.ma-iv, .qrev { border: 2px solid var(--cp-border); border-left-width: 6px; border-radius: 14px; }
.ma-iv.ok { border-left-color: var(--cp-success); }
.ma-iv.again { border-left-color: var(--cp-warning); }
.qrev { border-left-color: var(--cp-danger); }
pre.mail { border: 2px solid var(--x-edge); border-radius: 14px; background: var(--cp-surface-soft); }

/* Excelの対応シート */
.xlref { border: 1.5px solid var(--x-edge); background: var(--cp-surface); color: var(--cp-text-muted); font-weight: 600; padding: 4px 14px; }
.xlref b { color: var(--cp-text); }

/* ページの先頭へ */
.totop { background: var(--x-ink); color: #fff; border: 2px solid var(--x-ink); width: 48px; height: 48px; font-size: 0.9rem; }
.totop:hover { border-color: var(--x-orange); color: var(--x-orange); box-shadow: 0 0 0 3px rgba(251, 134, 25, 0.35); }
html[data-theme="dark"] .totop { background: var(--x-orange); color: var(--x-ink); border-color: var(--x-orange); }

/* ---------- トップページ：黒ボックスの見出し ---------- */
main.x-home > h1, main.x-home > .lroot > h1 { font-size: clamp(1.75rem, 1.1rem + 1.9vw, 2.75rem); line-height: 1.95; margin: 14px 0 14px; }
main.x-home h1 .x-box {
  background: var(--x-box-bg); color: var(--x-box-fg); padding: 0.06em 0.42em;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
main.x-home h1 .x-hl { font-style: normal; color: var(--x-orange); }
html[data-theme="dark"] main.x-home h1 .x-hl { color: #e0400e; }
main.x-home .grid3 { counter-reset: xt 1; }
main.x-home .grid3 > .tile.click { counter-increment: xt; position: relative; padding-right: 64px; }
main.x-home .grid3 > .tile.click::after {
  content: counter(xt, decimal-leading-zero); position: absolute; right: 14px; top: 8px;
  font-family: var(--x-en); font-style: italic; font-weight: 900; font-size: 1.75rem; line-height: 1.1;
  background: var(--x-grad); -webkit-background-clip: text; background-clip: text; color: transparent;
}

/* ---------- プレビューのお知らせ（共有用の補助） ---------- */
body .share-note {
  border: 2px solid var(--x-edge); border-radius: 14px; background: var(--cp-surface); color: var(--cp-text);
  box-shadow: 4px 4px 0 var(--x-edge);
}

/* ---------- スマホ・タブレット ---------- */
@media (max-width: 980px) {
  header.top { padding: 8px 12px; gap: 8px 10px; }
  .logo { width: 36px; height: 36px; border-radius: 11px; font-size: 1.05rem; }
  .brand .x-en { font-size: 0.6875rem; }
  header.top .navbtn { color: #fff; border-color: rgba(255, 255, 255, 0.34); }
  nav.side { border-right: 0; border-bottom: 2px solid var(--x-edge); }
  main { padding: 20px 16px 96px; }
  .card { padding: 18px 16px; border-radius: 18px; }
  .next-row .btn[data-complete] { width: 100%; justify-content: space-between; font-size: 1.0625rem; }
  main.x-home > h1, main.x-home > .lroot > h1 { line-height: 1.9; }
  /* 表：列が多い表は横にスクロール。1列目（科目名）は左に固定して読みやすく */
  main div > table.fs:has(tr > :nth-child(4)) { min-width: 520px; }
  main div > table.fs:has(tr > :nth-child(6)) { min-width: 640px; }
  main div > table.fs:has(tr > :nth-child(4)) tr > :first-child:not([colspan]) {
    min-width: 6.5em; max-width: 9em; position: sticky; left: 0; z-index: 1; box-shadow: inset -1px 0 0 var(--cp-border);
  }
  main div > table.fs:has(tr > :nth-child(4)) tr > td:first-child:not([colspan]) { background: var(--cp-surface); }
  main div > table.fs:has(tr > :nth-child(4)) tr.tot > td:first-child:not([colspan]) { background: var(--cp-surface-soft); }
}
@media (max-width: 640px) {
  .brand .x-en { display: none; }
  .x-cta-row .btn.x-cta { width: 100%; justify-content: space-between; font-size: 1.0625rem; }
}

/* ---------- 動きを減らす設定 ---------- */
@media (prefers-reduced-motion: reduce) {
  .tile, .opt, .btn, .chip, .sw, nav.side button { transition: none !important; }
  .tile.click:hover, .opt:hover, .btn:hover, .btn.x-cta:hover, .next-row .btn[data-complete]:hover { transform: none !important; }
}

/* ---------- 印刷 ---------- */
@media print {
  body { background: #fff !important; }
  .card, .quiz, .goal, .cfo, .tile, .kpi { border-width: 1px !important; box-shadow: none !important; }
  .cfo { padding-top: 16px; }
  .cfo::before, .cfo::after { display: none; }
  main.x-home h1 .x-box { background: none; color: inherit; padding: 0; }
  .x-cta-row { display: none; }
}

</style>

<body>
<header class="top">
  <div class="logo" aria-hidden="true">財</div>
  <div class="brand"><span class="x-en" aria-hidden="true">GLOBAL <em>CONTROLLER</em></span>外資系コントローラー養成アプリ<small>グローバル展開する外資系中小企業で「頼られる財務コントローラー」になる</small></div>
  <button class="iconbtn navbtn" id="navBtn" type="button" aria-controls="nav" aria-expanded="false">☰ 目次</button>
  <span class="hbreak" aria-hidden="true"></span>
  <div class="prog" title="完了したレッスンの数">
    <div class="bar"><i id="progbar"></i></div>
    <span id="progtxt">0 / 0 完了</span>
  </div>
  <div class="fsz" role="group" aria-label="文字の大きさ"><span class="lab">文字サイズ</span><button type="button" data-fs="m" title="標準の文字サイズ">標準</button><button type="button" data-fs="l" title="少し大きく">大</button><button type="button" data-fs="xl" title="もっと大きく">特大</button></div>
  <button class="iconbtn" id="themeBtn" type="button" aria-label="ライト／ダーク切り替え" title="ライト／ダーク切り替え">◐<span class="lab"> 表示切替</span></button>
</header>
<div class="layout">
  <nav class="side" id="nav" aria-label="レッスン一覧"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<script>
  (() => {
    const root = document.documentElement, hdr = document.querySelector("header.top");
    const syncHdr = () => { if (hdr) root.style.setProperty("--hdr-h", hdr.offsetHeight + "px"); };
    const mark = () => {
      const cur = root.getAttribute("data-fs") || "m";
      document.querySelectorAll(".fsz button").forEach((b) => { const on = b.dataset.fs === cur; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
      syncHdr();
    };
    document.querySelectorAll(".fsz button").forEach((b) => b.addEventListener("click", () => {
      const v = b.dataset.fs;
      if (v === "m") root.removeAttribute("data-fs"); else root.setAttribute("data-fs", v);
      try { localStorage.setItem("learn-ui:fs", v); } catch (e) { /* storage unavailable */ }
      mark();
    }));

<script>
  (() => {
    const root = document.documentElement;
    // remember the light/dark choice (the button itself is wired in each app)
    try {
      new MutationObserver(() => {
        try { localStorage.setItem("learn-ui:theme", root.getAttribute("data-theme") || "light"); } catch (e) { /* storage unavailable */ }
      }).observe(root, { attributes: true, attributeFilter: ["data-theme"] });
    } catch (e) { /* MutationObserver unavailable */ }
    // favicon drawn from the header logo in the theme accent color
    const logo = document.querySelector(".logo");
    if (logo) {
      const cs = getComputedStyle(root);
      const acc = cs.getPropertyValue("--cp-accent").trim(), fg = cs.getPropertyValue("--cp-accent-fg").trim();
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="14" fill="${acc}"/><text x="32" y="44" font-size="34" font-weight="700" text-anchor="middle" fill="${fg}" font-family="Segoe UI, Yu Gothic UI, Meiryo, sans-serif">${logo.textContent.trim()}</text></svg>`;
      let icon = document.querySelector('link[rel="icon"]');
      if (!icon) { icon = document.createElement("link"); icon.rel = "icon"; document.head.appendChild(icon); }
      icon.href = "data:image/svg+xml," + encodeURIComponent(svg);
    }
    // phones / tablets: the lesson list opens as a drawer from the header
    const navBtn = document.getElementById("navBtn");
    const setNav = (open) => {
      document.body.classList.toggle("nav-open", open);
      if (navBtn) navBtn.setAttribute("aria-expanded", open ? "true" : "false");
    };
    if (navBtn) navBtn.addEventListener("click", (e) => { e.stopPropagation(); setNav(!document.body.classList.contains("nav-open")); });
    document.addEventListener("click", (e) => {
      if (!document.body.classList.contains("nav-open")) return;
      if (e.target.closest("#nav [data-go]") || !e.target.closest("#nav")) setNav(false);
    });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") setNav(false); });
    // back-to-top button for long lessons
    const up = document.createElement("button");
    up.type = "button"; up.className = "totop"; up.textContent = "▲"; up.title = "ページの先頭へ"; up.setAttribute("aria-label", "ページの先頭へ");
    up.addEventListener("click", () => window.scrollTo({ top: 0, behavior: "smooth" }));
    document.body.appendChild(up);
    window.addEventListener("scroll", () => up.classList.toggle("show", window.scrollY > 900), { passive: true });
    // deep links: #lesson-id in the address bar (bookmarks, sharing, browser back/forward)
    const baseTitle = document.title;
    window.LearnShell = {
      hashId() { try { return decodeURIComponent(window.location.hash.slice(1)); } catch (e) { return ""; } },
      sync(id, title) {
        document.title = title && id !== "welcome" ? `${title}｜${baseTitle}` : baseTitle;
        try {
          const h = "#" + encodeURIComponent(id);
          if (!window.location.hash) history.replaceState(null, "", h);
          else if (window.location.hash !== h) history.pushState(null, "", h);
        } catch (e) { /* history API unavailable (sandboxed preview) */ }
      },
      start(lessons, fallback) { const h = this.hashId(); return lessons.some((l) => l.id === h) ? h : fallback; },
      xlRef(root, name) {
        const h1 = root.querySelector("h1");
        if (!h1 || !name) return;
        const p = document.createElement("p");
        p.className = "xlref";
        p.innerHTML = `<span aria-hidden="true">📗</span> Excel版の対応シート：「<b>${name}</b>」`;
        h1.insertAdjacentElement("afterend", p);
      },
    };
    const onHash = () => {
      const h = window.LearnShell.hashId();
      if (!h || typeof go !== "function" || typeof LESSONS === "undefined") return;
      if (LESSONS.some((l) => l.id === h) && h !== current) go(h);
    };
    window.addEventListener("popstate", onHash);
    window.addEventListener("hashchange", onHash);
    // shared quiz runner: one question at a time, score, review of missed questions, retry only the missed ones
    window.LearnQuiz = (box, all, cfg = {}) => {
      const AB = "ABCD";
      let qs = all, i = 0, score = 0, answered = false, wrong = [], retry = false;
      const title = (id) => (typeof LESSONS !== "undefined" && (LESSONS.find((l) => l.id === id) || {}).title) || "";
      const review = (q) => (q.lesson && title(q.lesson) ? `<a href="#" data-go="${q.lesson}">→「${title(q.lesson)}」を復習</a>` : "");
      const run = (list, isRetry) => { qs = list; i = 0; score = 0; wrong = []; retry = isRetry; show(); };
      const result = () => {
        const n = qs.length;
        let best = null;
        if (!retry && cfg.store && cfg.key) { best = Math.max(cfg.store.get(cfg.key, 0), score); cfg.store.set(cfg.key, best); }
        const msg = retry ? (score === n ? "全問クリア！ 苦手だった問題も、もう大丈夫です。" : "あと少し。解説とレッスンをもう一度読んでから、再チャレンジしよう。") : (cfg.msg ? cfg.msg(score, n) : "");
        const rev = wrong.map(({ q, j }) => `<div class="qrev"><div class="qq">${q.no ? `Q${q.no}　` : ""}${q.q}</div>
          <div class="qa ng">あなたの答え：${AB[j]}．${q.opts[j]}</div><div class="qa ok">正解：${AB[q.ans]}．${q.opts[q.ans]}</div>
          <div class="qe">${q.exp}${review(q) ? "　" + review(q) : ""}</div></div>`).join("");
        box.innerHTML = `<div style="text-align:center"><div class="kicker">${retry ? "RETRY RESULT" : "RESULT"}</div><div class="bigscore">${score} / ${n}</div>
          <p><b>${msg}</b></p>${best !== null ? `<p class="small muted">これまでの最高点：${best} 点</p>` : ""}
          <div class="btnrow" style="justify-content:center">${wrong.length ? `<button class="btn" type="button" data-qz="wrong">間違えた${wrong.length}問だけ解き直す</button>` : ""}
          <button class="btn${wrong.length ? " ghost" : ""}" type="button" data-qz="all">もう一度チャレンジ（${all.length}問）</button></div></div>
          ${wrong.length ? `<h3>間違えた問題の振り返り（${wrong.length}問）</h3><p class="small muted">正解と解説を読んで、必要ならレッスンに戻って復習しましょう。</p>${rev}` : `<p class="small muted" style="text-align:center">全問正解です。用語集やExcelの練習問題で、さらに力をのばしましょう。</p>`}`;
        const missed = wrong.map((w) => w.q);
        const bw = box.querySelector('[data-qz="wrong"]');
        if (bw) bw.addEventListener("click", () => run(missed, true));
        box.querySelector('[data-qz="all"]').addEventListener("click", () => run(all, false));
      };
      const show = () => {
        if (i >= qs.length) { result(); return; }
        const q = qs[i]; answered = false;
        box.innerHTML = `<div class="small muted">${retry ? "解き直し　｜　" : ""}問題 ${i + 1} / ${qs.length}　｜　正解 ${score}${cfg.pill ? "　｜　" + cfg.pill(q) : ""}</div><div class="bar" style="margin:6px 0 12px"><i style="width:${(i / qs.length) * 100}%"></i></div>
          <h2>${q.q}</h2><div class="opts">${q.opts.map((o, j) => `<button type="button" class="opt" data-j="${j}">${AB[j]}．${o}</button>`).join("")}</div>
          <div class="fb" id="qfb"></div><div class="btnrow"><button class="btn hide" type="button" id="qnext">${i + 1 === qs.length ? "結果を見る" : "次の問題へ ▶"}</button></div>`;
        box.querySelectorAll(".opt").forEach((b) => b.addEventListener("click", () => {
          if (answered) return; answered = true;
          const j = +b.dataset.j;
          if (j === q.ans) score += 1; else wrong.push({ q, j });
          box.querySelectorAll(".opt").forEach((x) => { const jj = +x.dataset.j; if (jj === q.ans) x.classList.add("right"); else if (jj === j) x.classList.add("wrong"); });
          const fb = box.querySelector("#qfb");
          fb.innerHTML = `<b>${j === q.ans ? "正解！" : "おしい！ 正解は " + AB[q.ans]}</b>　${q.exp}${review(q) ? "　" + review(q) : ""}`;
          fb.classList.add("show");
          box.querySelector("#qnext").classList.remove("hide");
        }));
        box.querySelector("#qnext").addEventListener("click", () => { i += 1; show(); });
      };
      run(all, false);
    };
  })();
</script>

T10", "与信を決める人とクレジットノートを出す人が同じだと、売上の操作ができてしまう"], ["T11", "T12", "給与データを変える人が支払も承認すると、架空社員などの不正が起きうる"]], "doa": [["購買・経費の発注", "部門長", "カントリーマネージャー", "APAC GM＋地域コントローラー", "本社CFO"], ["支払の承認", "コントローラー", "コントローラー＋カントリーマネージャー", "地域コントローラー", "本社CFO"], ["顧客との契約（値引きを含む）", "営業部長", "カントリーマネージャー", "APAC GM", "本社（法務・CFO）"], ["債権の償却（貸倒れ）", "コントローラー", "カントリーマネージャー", "地域コントローラー", "本社CFO"], ["予算外の人員採用", "－", "カントリーマネージャー", "APAC GM", "本社CFO"]], "pbc": [["試算表（12月末・確定版）", "経理担当B", "1/10"], ["銀行残高証明書・銀行勘定照合表", "経理担当A", "1/10"], ["売掛金の年齢表・残高確認状の送付リスト", "経理担当B", "1/12"], ["買掛金・未払費用の明細", "経理担当A", "1/12"], ["在庫明細・棚卸立会の記録", "コントローラー", "1/12"], ["関係会社取引の明細・本社とのIC残高確認", "コントローラー", "1/12"], ["固定資産台帳（取得・除却の明細）", "経理担当A", "1/14"], ["賞与・有給休暇引当金の計算資料", "コントローラー", "1/14"], ["リース契約の一覧（ASC 842用）", "経理担当A", "1/14"], ["売上の契約書・検収書のサンプル（監査人の指定分）", "経理担当B", "1/16"], ["移転価格の検証（利益率とレンジの比較）と年度末調整（True-up）の計算", "コントローラー", "1/16"], ["取締役会・株主総会の議事録、重要な契約の一覧", "コントローラー", "1/16"], ["法人税等・税効果の計算資料", "税理士法人", "1/20"], ["後発事象の確認、経営者確認書（ドラフト）", "コントローラー", "1/25"]], "taxAudit": ["過去の申告書・決算書・総勘定元帳・契約書をすぐ出せるように整理（電子帳簿保存法の要件も確認）", "本社との取引（管理料・ロイヤルティ・仕入価格）の契約書と、価格の決め方の説明資料（移転価格）", "源泉税：非居住者への支払と租税条約の届出書の控え", "交際費・寄附金・役員報酬など、指摘されやすい科目の根拠資料", "消費税：インボイス（登録番号）の保存、海外取引の課税・不課税の判定", "調査の連絡が来たら：税理士と日程・範囲を確認し、本社（地域コントローラー・税務部）にすぐ共有"], "phrases": [["月次の速報を送る", "Please find attached the October flash results for Japan. Key highlights are summarized below.", "10月の日本の速報を添付します。要点は以下のとおりです。"], ["予算比を説明する", "Hardware revenue came in at ¥173M, 2% above budget, mainly driven by stronger sensor kit volume.", "ハードの売上は1億7,300万円で予算比2%増。主にセンサーキットの販売数量の増加によるものです。"], ["一部相殺を伝える", "This was partially offset by lower average selling prices.", "一方で、平均販売単価の低下が一部相殺しました。"], ["為替の影響を分ける", "In USD, hardware revenue was $17k below budget: the weaker yen reduced it by $40k, while on a constant-currency basis it was 2% ($23k) above budget.", "ドル換算ではハードの売上は予算を1.7万ドル下回りました。円安の影響が−4万ドルで、為替一定ベースでは予算比2%（2.3万ドル）増です。"], ["一過性であることを伝える", "The increase in marketing spend is a one-off related to the Tokyo trade show.", "広告宣伝費の増加は東京の展示会に伴う一過性のものです。"], ["タイミングの差を説明する", "This is a timing difference, and we expect it to reverse in November.", "これはタイミングの差で、11月に解消する見込みです。"], ["リスクを早めに共有する", "I would like to flag a potential risk early: a key customer may delay its Q4 order.", "早めにリスクを共有します。主要顧客が第4四半期の発注を遅らせる可能性があります。"], ["影響額を伝える", "We estimate the impact at approximately ¥20M of revenue, or about $130k.", "影響額は売上で約2,000万円（約13万ドル）と見積もっています。"], ["対応策と次の連絡", "We are working with the sales team on mitigation actions and will update you by Friday.", "営業と対策を進めており、金曜日までに続報します。"], ["期限の調整をお願いする", "Given the national holiday in Japan on November 3, could we submit the final package on Monday, November 9 (JST), one business day after the usual deadline (Friday, November 6 on the HQ calendar)?", "11月3日は日本の祝日のため、確定パッケージの提出を通常の期限（本社の暦で11月6日・金）より1営業日遅い11月9日（月・日本時間）にさせていただけないでしょうか。"], ["ていねいに反対する", "I understand the urgency. However, because the contract has a substantive customer acceptance clause, recognizing this revenue before acceptance would not comply with ASC 606.", "急ぎの事情は理解しています。ただ、この契約には実質的な検収条件があるため、検収前に売上計上するのはASC 606に沿いません。"], ["代わりの案を出す", "As an alternative, we could include it in the forecast as upside and recognize it once the acceptance is received.", "代わりに、見込みの上振れ要因として示し、検収後に計上する方法があります。"], ["承認をお願いする", "Could you please approve the attached payment request by end of day Thursday (JST)?", "添付の支払依頼を木曜日（日本時間）中に承認いただけますか。"], ["日本の賞与を説明する", "In Japan, companies typically pay summer and winter bonuses. We accrue them monthly so that the P&L reflects the cost evenly.", "日本では夏と冬に賞与を払うのが一般的です。PLに均等に反映させるため毎月引き当てています。"], ["消費税を説明する", "Japanese consumption tax is 10%. It is generally recoverable, so it does not affect our P&L.", "日本の消費税は10%です。通常は控除できるのでPLには影響しません。"], ["租税条約を説明する", "Under the Japan-US tax treaty, royalties are exempt from Japanese withholding tax, provided that the parent meets the limitation-on-benefits (LOB) test and the treaty form, with the LOB attachment and a US residency certificate, is filed through us before the first payment.", "日米租税条約により、本社が特典条項（LOB）の条件を満たし、最初の支払の前に届出書（特典条項の付表と米国の居住者証明書付き）を当社経由で提出すれば、ロイヤルティの源泉税は免除されます。"], ["税務調査を報告する", "We have been notified of a routine tax audit scheduled for January. Our tax advisor will support us.", "1月に定期的な税務調査の連絡がありました。税理士がサポートします。"], ["監査資料の予定を伝える", "We will upload all PBC items to the shared folder by January 20, except for the draft management representation letter, which we will provide by January 25.", "PBC資料は1月20日までに共有フォルダにアップします（経営者確認書のドラフトのみ1月25日）。"], ["監査の修正に合意する", "The auditors proposed a ¥1.2M cut-off adjustment. We agree and will book it in the December close.", "監査人から120万円のカットオフ修正の提案がありました。合意し、12月決算で計上します。"], ["内容を確認する", "Could you clarify whether the management fee should be charged quarterly or annually?", "管理料の請求が四半期ごとか年1回か、確認させてください。"], ["認識をそろえる", "Just to make sure we are on the same page: the budget rate is ¥145 per US dollar.", "念のため確認です。予算レートは1ドル145円ですね。"], ["催促する（ていねいに）", "Following up on my email below. Do you have any update on the transfer pricing true-up?", "下記メールの件で再度ご連絡します。TP調整の進み具合はいかがでしょうか。"], ["遅れをわびて対応を示す", "Apologies for the delay. The bank statement arrived late; the reconciliation will be completed by noon tomorrow.", "遅れて申し訳ありません。銀行明細の到着が遅れました。照合は明日の正午までに終えます。"], ["改善を提案する", "To speed up the close, I propose moving the accrual cut-off to WD-1.", "締めを早めるため、未払い計上の締めをWD-1に前倒しすることを提案します。"], ["成果を報告する", "We closed October on WD+3, two days faster than last quarter.", "10月はWD+3で締めました。前四半期より2日早くなりました。"], ["会議をまとめる", "To summarize our discussion: first, ...; second, ...; and third, ...", "本日の議論をまとめます。1つ目は…、2つ目は…、3つ目は…です。"], ["数字の確認をお願いする", "Could you double-check the FX rate used for the intercompany invoice? I see a $2k difference.", "IC請求書に使った為替レートをご確認いただけますか。2千ドルの差があります。"], ["職務分掌を説明する", "For segregation of duties, the person who sets up vendors should not release payments.", "職務分掌のため、仕入先を登録する人は支払を実行すべきではありません。"], ["送金先変更を確認する", "We received a request to change the vendor's bank details. Per our policy, we will verify it by calling the vendor's registered phone number.", "仕入先から口座変更の依頼がありました。規程に従い、登録済みの電話番号に確認します。"], ["エスカレーションを予告する", "If we cannot resolve this by WD+2, I will escalate it to the regional controller.", "WD+2までに解決できなければ、地域コントローラーにエスカレーションします。"]], "emails": [["月次の速報（Flash）", "Subject: Japan - October flash results\n\nHi [Name],\n\nPlease find attached the October flash results for Japan (US GAAP, JPY).\n- Revenue: ¥289.0M, ¥6.0M (2.0%) below budget. Hardware was ¥3.3M above budget (higher volume, partly offset by discounts), but two SaaS go-lives slipped to December (-¥9.3M, timing only).\n- Gross margin: 35.6%, 0.4pt below budget, due to Sensor Kit discounts and the weaker yen.\n- Opex: ¥87.9M, ¥5.2M above budget; about 40% is the trade show pulled forward from November.\n- Operating income: ¥15.1M, ¥8.4M below budget.\n- Cash: ¥250M at month-end, in line with forecast.\n\nThe final package will follow on WD+5. Please let me know if you have any questions.\n\nBest regards,\n[Your name]"], ["リスクの早期共有", "Subject: Japan - early flag: possible Q4 order delay\n\nHi [Name],\n\nI would like to flag a potential risk early. Customer X may delay its Q4 order (about ¥20M / $130k of revenue).\n\nWhat we know: ...\nNext steps: we are meeting the customer on Nov 5 and will update you by Nov 6.\n\nBest regards,\n[Your name]"], ["日本特有の事情の説明", "Subject: Japan bonus accrual - background\n\nHi [Name],\n\nIn Japan, companies typically pay bonuses twice a year (June and December). The winter bonus covers June to November, so we accrue ¥3M each month. This avoids a large one-time charge in December and matches the cost with the period in which employees work.\n\nBest regards,\n[Your name]"], ["期限の相談", "Subject: Japan - October close timing\n\nHi [Name],\n\nNovember 3 is a national holiday in Japan, so we will have one fewer working day before the HQ deadline for the October close (WD+5 on the HQ calendar = Friday, November 6). To keep the quality of the close, could we submit the final package on Monday, November 9 (JST), one business day later than usual? The flash will still be submitted on time.\n\nThank you for your understanding.\n\nBest regards,\n[Your name]"], ["ていねいに断り、代案を出す", "Subject: Re: Q4 revenue - Customer Y shipment\n\nHi [Name],\n\nI understand the importance of the Q4 target. However, the customer acceptance in this contract is substantive and will take place on January 8, so we cannot recognize the revenue in December under ASC 606.\n\nAs an alternative, I suggest we (1) show it as upside in the forecast, and (2) work with the customer to bring the acceptance date forward. I am happy to discuss.\n\nBest regards,\n[Your name]"]], "plan90": [["1〜30日目：理解する", "関係者と1on1（カントリーマネージャー、地域コントローラー、本社FP&A、税理士、監査人、銀行）／直近3か月の締めと報告パッケージを読む／業務の流れ（購買→支払、受注→入金、給与）を担当者と一緒に確認／システムの権限・アクセスを確認", "関係者マップ、リスクTOP10、年間の期限カレンダー"], ["31〜60日目：安定させる", "締めのチェックリストとカレンダーを整備／すべてのBS勘定を照合／すぐできる統制（銀行の2名承認、口座変更の電話確認）／賞与・有給の引当ルールを決める／主要な販売契約の収益認識（ASC 606）を確認／本社とのIC照合を毎月の作業にする／週次の資金繰りを始める", "締めチェックリスト、BS照合一覧、統制の改善リスト"], ["61〜90日目：改善する", "締めの早期化（WD+5→WD+3）／見込みの精度向上／KPIダッシュボード（DSO・現金・経費）／銀行データや経費の自動連携／監査への準備／本社に「90日レポート」で成果と次の提案を報告", "90日レポート、KPIダッシュボード、改善ロードマップ"]], "comp": [["月次決算・締めの運営", "発生主義で正しく早く締め、BS照合と増減分析で説明できる"], ["本社報告・GAAP調整", "日本基準→US GAAP/IFRSの調整（収益認識を含む）、グループ科目への組替え、USD報告ができる"], ["予算・見込み・予実分析", "数量・単価・為替に分けて差異を説明し、見込みに反映できる"], ["日本の税務・法令対応", "法人税・消費税・源泉税・移転価格・社会保険の期限と論点を押さえている"], ["資金管理（キャッシュ）", "13週資金繰り、運転資本（DSO等）、本社との資金調整ができる"], ["内部統制・不正防止", "少人数でも職務分掌と承認ルールを設計し、不正の兆候に気づける"], ["監査・税務調査の対応", "PBCを計画的に準備し、根拠をもって説明・交渉できる"], ["データ活用・可視化", "ERPのデータをExcel・Power BIで分析・自動化し、グラフ1枚で伝えられる"], ["英語コミュニケーション", "結論から簡潔に、数字と理由と対策をセットで英語で伝えられる"], ["ビジネスパートナーとしての力", "数字で事業の判断を助け、社内外から頼られる存在になっている"]], "scenarios": [["夜9時、本社FP&Aからメール：『日本の販管費が見込みより15%多い。明朝（米国時間）までに理由を』。どう返す？", ["「申し訳ありません。今後は経費を削減します」とだけ返す", "要因（展示会6,000千円は一過性、コンサル1,500千円は11月まで）・通期への影響・対応策を、数字つきで簡潔に返す", "朝になってから考える（返信は保留）", "カントリーマネージャーに転送して任せる"], 1, "本社が知りたいのは「何が・いくら・一過性か継続か・通期への影響・次の手」。結論→要因（金額）→見通しの順で、短く返しましょう。"], ["四半期末、カントリーマネージャーが『検収はまだだが、出荷済みの2,000万円を今期の売上にしてほしい』と言ってきた。", ["言われたとおり計上する", "「無理です」とだけ断る", "この契約の検収は実質的な条件なので、ASC 606では検収前に計上できないと説明し、見込みの上振れとして示す・検収を早める等の代案を出す（必要なら地域コントローラーに相談）", "本社に黙って翌月に計上する"], 2, "ルールを守りつつ、事業の目的（数字の達成）にも寄り添う代案を出すのがコントローラーの腕の見せどころです。なお、検収が形式的（仕様どおりかを客観的に確かめられる）なら、出荷・納品の時点で計上できることもあります。契約書の条件を確認しましょう。"], ["仕入先から『振込先の口座が変わりました。今日中にこちらへ』とメールが来た。", ["すぐに口座を変更して支払う", "メールに書かれた電話番号に確認する", "以前から登録している連絡先に電話して確認し、マスタ変更の承認手続きを経てから支払う", "本社に転送して終わりにする"], 2, "ビジネスメール詐欺（BEC）の典型例。メールの連絡先は偽物の可能性があるので、必ず登録済みの連絡先で確認します。"], ["明日、本社にロイヤルティを支払う。租税条約の届出書をまだ出していないことに気づいた。", ["気にせず全額を送金する", "支払前に届出書を提出する。間に合わなければ20.42%を源泉徴収し、あとで還付を請求する（本社にも影響を説明）", "源泉税は本社が米国で払うので日本では不要", "支払を半年遅らせる"], 1, "届出書がないと国内法の税率（20.42%）で源泉徴収する必要があります。期限（翌月10日）までに納付し、還付請求で取り戻せます。"], ["資金繰り表を見ると、本社への支払（15日）の週に現金が最低保有額を下回る。", ["仕入先への支払を勝手に遅らせる", "本社への支払日を顧客の入金（月末）のあとに変える、または事前に本社と資金の手当てを相談する", "何もしない（なんとかなる）", "銀行から高い金利で急に借りる"], 1, "原因は「入金は月末、支払は15日」というタイミングのずれ。本社との支払条件を見直すのが根本的な解決です。"], ["監査人から『有給休暇引当金がUS GAAPの報告に入っていない』と指摘された。", ["日本では計上しないと反論する", "指摘に合意してGAAP調整を計上し、毎月の計算を締めの作業に組み込む", "来年考える", "金額が小さいので無視する"], 1, "日本基準の帳簿にない項目でも、グループ報告（US GAAP）では必要なことがあります。仕組みに組み込んで再発を防ぎましょう。"]], "quiz": [{"q": "外資系日本法人のコントローラーの主な報告先として、最も一般的なのは？", "opts": ["日本の税務署だけ", "地域（APAC）コントローラーや本社財務（＋日本の代表者）", "取引銀行だけ", "顧客"], "ans": 1, "exp": "本社・地域の財務と、日本の代表者の両方に報告するのが一般的です。"}, {"q": "月次決算の「WD+3」とは？", "opts": ["月末の3日前", "翌月の3営業日目", "3週間後", "3か月後"], "ans": 1, "exp": "WD＝Working Day（営業日）。月末後の3営業日目です。"}, {"q": "10月分の外注作業の請求書が11月に届く。10月にすべきことは？", "opts": ["何もしない", "未払費用として見積もって計上する", "11月に計上する", "前払費用に計上する"], "ans": 1, "exp": "発生主義。作業が10月なら費用も10月です。"}, {"q": "1年分の保険料を一括で払った。正しい処理は？", "opts": ["全額をその月の費用にする", "前払費用に計上し、毎月按分して費用にする", "資産のまま放置する", "売上から差し引く"], "ans": 1, "exp": "期間に合わせて費用化します。"}, {"q": "増減分析（Flux）でコメントが必要なのは？", "opts": ["すべての科目", "金額と率の基準（例：100万円かつ10%）を超えた科目", "増えた科目だけ", "売上だけ"], "ans": 1, "exp": "基準を決めて、重要な変動に集中して説明します。ただし売上・粗利率・営業利益は、基準に関係なく毎月必ずコメントします（本社が最初に見る数字）。"}, {"q": "US GAAPの報告で、日本基準の帳簿にないことが多い調整は？", "opts": ["有給休暇引当金", "現金", "資本金", "消費税"], "ans": 0, "exp": "未使用の有給休暇の負債は、US GAAP・IFRSでは計上が必要になることが多いです。"}, {"q": "年間保守契約1,200万円を10月に請求。US GAAP（ASC 606）で10月の売上は？（12か月均等）", "opts": ["1,200万円", "100万円", "0円", "600万円"], "ans": 1, "exp": "サービスを提供した期間に合わせて計上します。残りは前受収益（契約負債）。"}, {"q": "ハード（単独販売価格15,000千円）と1年のSaaS（同10,000千円）をセットで22,500千円で売った。ASC 606でハードに配分する取引価格は？", "opts": ["15,000千円", "13,500千円", "12,500千円", "22,500千円"], "ans": 1, "exp": "値引きを単独販売価格（SSP）の比率で配分します。22,500×15,000÷25,000＝13,500千円。SaaSは9,000千円（月750千円）です。"}, {"q": "上の契約で、11月にハードの検収が済み、15,000千円を請求した（SaaSは12月開始）。US GAAPで11月に計上する売上は？", "opts": ["0円", "15,000千円", "13,500千円", "22,500千円"], "ans": 2, "exp": "履行義務を果たした（ハードの支配が移った）分だけ計上します。請求額との差1,500千円は契約負債（前受け）です。"}, {"q": "12/28に出荷したハードの契約に、実質的な検収条件（顧客が性能を確かめて合否を決める）があり、検収は1/8の予定。12月の売上は？", "opts": ["0円（検収の1月に計上）", "出荷した12月に全額", "12月と1月で半分ずつ", "請求書を出せば12月に計上できる"], "ans": 0, "exp": "検収が実質的な条件なら、検収で支配が移る1月の売上です。形式的な検収（仕様どおりかを客観的に確かめられる）なら、出荷・納品の時点で計上できることもあります。"}, {"q": "日本の子会社の法人税の申告は、どの決算書をもとに行う？", "opts": ["本社に出すUS GAAPの報告パッケージ", "IFRSの連結財務諸表", "日本基準の決算書（株主総会で確定したもの）", "どれでもよい"], "ans": 2, "exp": "日本は確定決算主義。株主総会で確定した日本基準の決算書をもとに申告します。"}, {"q": "資本金9,000万円・負債も小さいルミナの日本基準の決算について、正しいのは？", "opts": ["会計監査人による法定監査が必ず必要", "IFRSで作らなければならない", "会社法の大会社ではないので、会計監査人の監査は義務ではない", "US GAAPで作らなければならない"], "ans": 2, "exp": "大会社は資本金5億円以上または負債200億円以上。ルミナでは、グループ監査人がUS GAAPの報告パッケージを監査します。"}, {"q": "US GAAP（ASC 842）で、事務所の賃貸（オペレーティング・リース）の費用はどう表示する？", "opts": ["減価償却費と支払利息に分ける", "費用にしない", "特別損失にする", "定額のリース費用として営業費用にする"], "ans": 3, "exp": "IFRS第16号は減価償却費＋支払利息に分かれるため、EBITDAが大きくなります。"}, {"q": "のれんを規則的に償却するのは？（上場企業の場合）", "opts": ["日本基準", "US GAAP", "IFRS", "3つとも"], "ans": 0, "exp": "日本基準は20年以内で償却。US GAAP（上場企業）とIFRSは償却せず、毎年減損テストをします。"}, {"q": "のれん以外の固定資産の減損を、価値が回復したら戻し入れるのは？", "opts": ["日本基準", "IFRS", "US GAAP", "3つとも"], "ans": 1, "exp": "日本基準とUS GAAPは戻し入れ禁止。 function gaapCalc(on, rate) {
  const acc = {}, adj = {};
  D.groupAccts.forEach((g) => { acc[g] = 0; adj[g] = 0; });
  D.localPL.forEach(([, amt, g]) => { acc[g] += amt; });
  D.gaapAdj.forEach(([, , g, amt], i) => { if (on[i]) adj[g] += amt; });
  const rows = [];
  const line = (lab, a, b, tot) => rows.push({ lab, a, b, c: a + b, usd: (a + b) / rate, tot });
  const g = (k) => [acc[k], adj[k]];
  line("4000 Revenue", ...g("4000 Revenue"));
  line("5000 Cost of revenue", ...g("5000 Cost of revenue"));
  const gp = [acc["4000 Revenue"] - acc["5000 Cost of revenue"], adj["4000 Revenue"] - adj["5000 Cost of revenue"]];
  line("Gross profit", ...gp, 1);
  const opexK = D.groupAccts.filter((k) => k.startsWith("6"));
  opexK.forEach((k) => line(k, ...g(k)));
  const ox = [opexK.reduce((s, k) => s + acc[k], 0), opexK.reduce((s, k) => s + adj[k], 0)];
  line("Total opex", ...ox, 1);
  const oi = [gp[0] - ox[0], gp[1] - ox[1]];
  line("Operating income", ...oi, 1);
  line("7100 FX (gain)/loss", ...g("7100 FX (gain)/loss"));
  line("Income before tax", oi[0] - acc["7100 FX (gain)/loss"], oi[1] - adj["7100 FX (gain)/loss"], 1);
  return rows;
}
function pvmCalc(items, budRate, actRate) {
  const rows = items.map(([name, bq, bp, aq, ap]) => ({ name, bud: bq * bp, act: aq * ap, vol: (aq - bq) * bp, price: (ap - bp) * aq }));
  const t = rows.reduce((s, r) => ({ bud: s.bud + r.bud, act: s.act + r.act, vol: s.vol + r.vol, price: s.price + r.price }), { bud: 0, act: 0, vol: 0, price: 0 });
  const budUSD = t.bud / budRate, actUSD = t.act / actRate, cc = (t.act - t.bud) / budRate, fx = t.act / actRate - t.act / budRate;
  return { rows, t, budUSD, actUSD, cc, fx };
}
function cashCalc(o) {
  const n = D.cashWeeks.length;
  const rec = D.cashLines[0][2];
  const outs = D.cashLines.filter((l) => l[1] === "out");
  let bal = o.open;
  const res = [];
  for (let w = 0; w < n; w++) {
    const r = rec[w] * (1 - o.slip) + (w > 0 ? rec[w - 1] * o.slip : 0);
    const fund = w === o.fwk - 1 ? o.famt : 0;
    const ic = w - o.delay >= 0 ? D.cashIC[w - o.delay] : 0;
    const out = outs.reduce((s, l) => s + l[2][w], 0) + ic;
    const beg = bal;
    bal = beg + r + fund - out;
    res.push({ w, beg, rec: r, fund, ic, out, end: bal });
  }
  return res;
}
function whtCalc(type, cty, amt, filed, gross) {
  const svc = type === D.whtTypes[3];
  const t = D.treaty.find((x) => x[0] === cty);
  const idx = type === D.whtTypes[1] ? 1 : type === D.whtTypes[2] ? 2 : 3;
  const dom = svc ? 0 : D.whtDomestic, tre = svc ? 0 : t[idx];
  const rate = filed ? tre : dom;
  const gross_ = gross ? amt / (1 - rate) : amt;
  const wht = gross ? gross_ * rate : amt * rate;
  return { dom, tre, rate, wht, net: gross ? amt : amt - wht, cost: gross_, note: t[4] };
}

    ${mq("年間保守契約1,200万円を10月に請求。US GAAP（ASC 606）で10月の売上は？（12か月均等）", ["1,200万円", "100万円", "0円", "600万円"], 1, "提供した期間に合わせて計上します。残り1,100万円は前受収益（契約負債）。BSなので期末レートでドル換算します。日本基準（収益認識基準）でも考え方は同じです。")}
    ${mq("ルミナ（機能通貨＝円）の10月。ルミナのPL（損益）に入る為替の影響は？", ["ドル建て買掛金を月末レートで評価替えした差（為替差損）だけ", "円の財務諸表をドルに換算した差（CTA）だけ", "両方", "どちらも入らない"], 0, `外貨建て残高の再測定の差（為替差損${f0(D.fxr.loss)}千円）はルミナのPL。財務諸表全体をドルに換算した差（CTA ${f1(D.fxr.cta)}千ドル）は、本社の連結のOCIに入り、PLには入りません。`)}

function Variance() {
  const [a, b] = D.pvm;
  const sl = (id, lab, min, max, step, v) => `<div class="ctrl"><label for="${id}">${lab}</label><input type="range" id="${id}" min="${min}" max="${max}" step="${step}" value="${v}"><output id="${id}o"></output></div>`;
  return { html: `${head("M3", "予実分析 ── 数量・価格・為替に分けて説明する", "単位：千円・千ドル")}
    ${goal("予算と実績の差を「数量」「価格」「為替」に分け、英語で説明できるようになる")}
    ${tip("数量差異＝（実績数量−予算数量）×予算単価　／　価格差異＝（実績単価−予算単価）×実績数量　／　為替の影響＝実績の円売上を実際のレートと予算レートでドルにしたときの差", "計算式")}
    <div class="card"><h2>実績を動かしてみよう（予算：${a[0]} ${a[1]}台×${a[2]}、${b[0]} ${b[1]}台×${b[2]}、予算レート${D.fx.budget}円）</h2>
      ${sl("aq", a[0] + "：実績の数量", 700, 1500, 10, a[3])}${sl("ap", a[0] + "：実績の単価（千円）", 95, 135, 1, a[4])}
      ${sl("bq", b[0] + "：実績の数量", 100, 300, 5, b[3])}${sl("bp", b[0] + "：実績の単価（千円）", 220, 290, 1, b[4])}
      ${sl("fxr", "実際の平均レート（円／ドル）", 130, 165, 1, D.fx.avg)}
      <div class="grid2"><div><div class="tbl-wrap"><table class="fs" id="vt"></table></div></div><div><h3>予算から実績への橋わたし（千円）</h3><div class="wf" id="vwf"></div></div></div>
      <h3>英語コメント（自動作成）</h3><div class="analogy" id="ven" style="font-family:Consolas,'Courier New',monospace;font-size:0.875rem;line-height:1.75"></div>
      <div class="btnrow"><button class="btn ghost" type="button" id="vcopy">コメントをコピー</button><button class="btn ghost" type="button" id="vreset">ケースの値に戻す</button><span id="vmsg" class="small muted"></span></div></div>
    ${mq("円では予算を達成したのに、ドルでは未達。最も考えられる理由は？", ["数量が足りなかった", "円安（予算レートより実際のレートが円安）でドル換算の売上が目減りした", "値上げしすぎた", "計算ミス"], 1, "為替の影響を分け、「為替一定ベースでは達成」と実力を説明しましょう。")}
    ${cfo("円で見ると予算達成、ドルで見ると未達――外資系では日常茶飯事です。為替の影響を分けて示さないと、本社に「日本は未達」と誤解されます。")}`,
    mount(root) {
      const ids = ["aq", "ap", "bq", "bp", "fxr"];
      const draw = () => {
        const v = Object.fromEntries(ids.map((i) => [i, +$("#" + i, root).value]));
        ids.forEach((i) => { $("#" + i + "o", root).textContent = i === "fxr" ? v[i] + "円" : f0(v[i]); });
        const items = [[a[0], a[1], a[2], v.aq, v.ap], [b[0], b[1], b[2], v.bq, v.bp]];
        const r = pvmCalc(items, D.fx.budget, v.fxr);
        const t = r.t, varr = t.act - t.bud;
        $("#vt", root).innerHTML = `<tr><th>項目</th><th class="n">予算</th><th class="n">数量差異</th><th class="n">価格差異</th><th class="n">実績</th></tr>` +
          r.rows.map((x) => `<tr><td>${x.name}</td><td class="n">${f0(x.bud)}</td><td class="n ${cls(x.vol)}">${sg(x.vol)}</td><td class="n ${cls(x.price)}">${sg(x.price)}</td><td class="n res">${f0(x.act)}</td></tr>`).join("") +
          `<tr class="tot"><td>合計（千円）</td><td class="n">${f0(t.bud)}</td><td class="n">${sg(t.vol)}</td><td class="n">${sg(t.price)}</td><td class="n">${f0(t.act)}</td></tr>
           <tr><td>ドル（千ドル）</td><td class="n">${f1(r.budUSD)}</td><td colspan="2" class="n small">為替一定 ${sg1(r.cc)}／為替 ${sg1(r.fx)}</td><td class="n res">${f1(r.actUSD)}</td></tr>`;
        const steps = [["予算", t.bud, 1], ["数量差異", t.vol], ["価格差異", t.price], ["実績", t.act, 1]];
        const mn = Math.min(t.bud, t.act, t.bud + t.vol) * 0.9, mx = Math.max(t.bud, t.act, t.bud + t.vol) * 1.03;
        let run = 0;
        $("#vwf", root).innerHTML = steps.map(([l, val, base]) => {
          let left, width, c;
          if (base) { left = mn; width = val - mn; c = "c-gray"; run = val; } else { const s0 = run; run += val; left = Math.min(s0, run); width = Math.abs(val); c = val >= 0 ? "c-ok" : "c-acc"; }
          return `<div class="row" style="grid-template-columns:90px 1fr 80px"><div>${l}</div><div class="track"><div class="blk ${c}" style="left:${(left - mn) / (mx - mn) * 100}%;width:${Math.max(width, 0) / (mx - mn) * 100}%"></div></div><div class="mono" style="text-align:right;font-weight:700">${base ? f0(val) : sg(val)}</div></div>`;
        }).join("");
        const A = r.rows[0];
        $("#ven", root).textContent = `Hardware revenue was JPY ${(t.act / 1000).toFixed(1)}M, JPY ${(Math.abs(varr) / 1000).toFixed(1)}M (${pc(Math.abs(varr) / t.bud)}) ${varr >= 0 ? "above" : "below"} budget. ` +
          `Sensor Kit volume ${A.vol >= 0 ? "added" : "reduced revenue by"} JPY ${(Math.abs(A.vol) / 1000).toFixed(1)}M, ${A.price < 0 ? "partly offset by price discounts of" : "and pricing added"} JPY ${(Math.abs(A.price) / 1000).toFixed(1)}M. ` +
          `In USD, revenue was $${Math.round(r.actUSD).toLocaleString("en-US")}k, $${Math.abs(Math.round(r.actUSD - r.budUSD)).toLocaleString("en-US")}k ${r.actUSD >= r.budUSD ? "above" : "below"} budget; ` +
          `FX ${r.fx < 0 ? "reduced" : "increased"} revenue by $${Math.abs(Math.round(r.fx))}k, and on a constant-currency basis revenue was $${Math.abs(Math.round(r.cc))}k ${r.cc >= 0 ? "above" : "below"} budget.`;
      };
      ids.forEach((i) => $("#" + i, root).addEventListener("input", draw));
      $("#vreset", root).addEventListener("click", () => { $("#aq", root).value = a[3]; $("#ap", root).value = a[4]; $("#bq", root).value = b[3]; $("#bp", root).value = b[4]; $("#fxr", root).value = D.fx.avg; draw(); });
      $("#vcopy", root).addEventListener("click", async () => {
        const t = $("#ven", root).textContent;
        try { await navigator.clipboard.writeText(t); $("#vmsg", root).textContent = "コピーしました"; } catch (e) { $("#vmsg", root).textContent = "コピーできない環境です。テキストを選択してコピーしてください"; }
      });
      draw();
    } };
}

/* same formulas as the Excel sheet "M2-2" (and ctl_data.std_calc) */
function stdCalc(p, opt) {
  const i = p.rate / 12;
  const pv = (n) => (p.rent * (1 - (1 + i) ** -n)) / i;
  const l0 = pv(p.months - p.free) / (1 + i) ** p.free, l12 = pv(p.months - 12), l24 = pv(p.months - 24);
  const pay = 12 * p.rent, interest = pay - (l12 - l24), dep = (l0 * 12) / p.months, sl = ((p.rent * (p.months - p.free)) / p.months) * 12;
  const on = opt.on, rec = Math.max(p.viu, p.fvlcd);
  const res = ["jp", "us", "ifrs"].map((std) => {
    const newLease = std === "ifrs" || (std === "jp" && opt.jpLease === 1);
    let imp = 0;
    if (std === "ifrs") imp = Math.max(0, p.carrying - rec);
    else if (p.undiscounted < p.carrying) imp = p.carrying - (std === "jp" ? rec : p.fvlcd);
    const raw = [newLease ? dep : std === "us" ? sl : pay, std === "jp" ? 0 : p.leave_close - p.leave_open,
      p.server / (std === "jp" ? p.life_jp : p.life_grp), std === "jp" ? p.goodwill / p.gw_years : 0, imp,
      std === "ifrs" || (std === "jp" && opt.jpInv === 0) ? -p.inv_wd : 0];
    const items = raw.map((v, j) => (on[j] ? v : 0));
    const total = items.reduce((a, b) => a + b, 0), oi = p.core - total, intr = newLease && on[0] ? interest : 0;
    const da = (newLease ? items[0] : 0) + items[2] + items[3] + items[4];
    let liab = 0, rou = 0;
    if (on[0] && newLease) { liab = l24; rou = (l0 * (p.months - 24)) / p.months; }
    else if (on[0] && std === "us") { liab = l24; rou = l24 - ((24 * sl) / 12 - (24 - p.free) * p.rent); }
    return { items, total, oi, intr, pretax: oi - intr, ebitda: oi + da, liab, rou, leaveBs: on[1] && std !== "jp" ? p.leave_close : 0 };
  });
  return { res, lease: { l0, l12, l24, pay, interest, dep, sl } };
}

function stdBars(R) {
  const W = 760, H = 300, L = 72, Rm = 12, T = 22, B = 40, ih = H - T - B;
  const groups = [["営業利益", "oi"], ["税引前利益", "pretax"], ["EBITDA", "ebitda"]];
  const mx = Math.max(1, ...R.flatMap((r) => groups.map(([, k]) => r[k])));
  const unit = 10 ** Math.floor(Math.log10(mx)) / 2, top = Math.ceil((mx * 1.12) / unit) * unit;
  const Y = (v) => T + ih - (Math.max(v, 0) / top) * ih;
  const gw = (W - L - Rm) / groups.length, bw = Math.min(58, gw / 4);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="3つの基準の利益の比較" style="width:100%;height:auto;display:block">`;
  for (let k = 0; k <= 4; k++) { const v = (top / 4) * k; s += `<line class="cb-axis" x1="${L}" x2="${W - Rm}" y1="${Y(v)}" y2="${Y(v)}"/><text class="cb-txt" x="${L - 6}" y="${Y(v) + 4}" text-anchor="end">${f0(v)}</text>`; }
  groups.forEach(([lab, key], g) => {
    const cx = L + gw * (g + 0.5);
    R.forEach((r, k) => {
      const x = cx + (k - 1.5) * bw * 1.12 + bw * 0.06, v = r[key];
      s += `<rect class="${["sb-jp", "sb-us", "sb-if"][k]}" x="${x}" y="${Y(v)}" width="${bw}" height="${Math.max(T + ih - Y(v), 0)}" rx="3"><title>${SNAME[k]}：${f0(v)}千円</title></rect>`;
      s += `<text class="cb-txt" x="${x + bw / 2}" y="${Y(v) - 5}" text-anchor="middle">${f0(v)}</text>`;
    });
    s += `<text class="cb-lab" x="${cx}" y="${H - 14}" text-anchor="middle">${lab}</text>`;
  });
  return s + "</svg>";
}

function m10BindSortQ(root, id, n, answer, explain) {

/* ---------- M10-3 Power BI入門 ---------- */
function m10ParseInput(s) {
  let t = String(s).trim().replace(/[,，\s]/g, "").replace(/[−ー－]/g, "-");
  if (!t) return null;
  let pct = false, k = false;
  if (/%$/.test(t)) { pct = true; t = t.slice(0, -1); }
  if (/[kK]$/.test(t)) { k = true; t = t.slice(0, -1); }
  const v = Number(t);
  return Number.isFinite(v) ? { v, pct, k } : null;
}
function m10Judge(inp, exp, unit) {
  const p = m10ParseInput(inp);
  if (!p) return { ok: false, msg: "数字で入力してください" };
  if (p.k) return { ok: false, msg: "「K」は表示単位が自動のときの表示です。カードの［表示単位］を「なし」にして、千円のまま入力しましょう" };
  if (unit === "%") { const v = p.pct ? p.v / 100 : p.v; return Math.abs(v - exp) < 0.0005 || Math.abs(p.v - exp * 100) < 0.05 ? { ok: true } : { ok: false, msg: "一致しません" }; }
  return Math.abs(p.v - exp) < 0.5 ? { ok: true } : { ok: false, msg: Math.abs(p.v - M10.noSign) < 0.5 ? "Sign を掛けない Actual を使っていませんか？ Actual PL を使います" : "一致しません" };
}
function Present3() {

  return { html: `${head("M10", "Power BI入門 ── 毎月のレポートを自動化し、正しい数字を届ける", "Power BI Desktop（無料）と練習データ（CSV）で、M10-2と同じダッシュボードを作り、Excelの数字と照合します。")}
    ${goal("Excel・PowerPoint・Power BIを使い分け、データモデル・DAX・照合・統制のポイントを押さえて、Power BIのレポートを自分で作れるようになる")}

      ${tip("Power BIは「Excelの代わり」ではありません。計算と検証はExcel、ストーリーはPowerPoint、毎月くり返すモニタリングはPower BI、と役割を分けるのがコツです。")}</div>
    <div class="card"><h2>コントローラーに必要なレベル（目標：Lv2〜Lv3）</h2><p class="small muted">自分ができるものにチェックを入れましょう（このブラウザに保存されます）。（OneDriveのプレビューで開いたときは保存されません。記録を残したいときは、このHTMLファイルをダウンロードしてブラウザで開いてください）</p>
      <div class="grid2">${P.levels.map(([l, t, can, feat, target]) => `<label class="tile m10-lv ${target ? "tgt" : ""}"><div class="t"><input type="checkbox" data-lv="${l}" ${lv[l] ? "checked" : ""}> ${l}　${t} ${target ? '<span class="pill acc">目標</span>' : ""}</div><div class="s">${can}</div><div class="small muted" style="margin-top:4px">使う機能：${feat}</div></label>`).join("")}</div>

    <div class="card"><h2>DAXメジャー（${P.dax.length}個・コピーして使えます）</h2><p class="small muted">右の値は、スライサーで 2026-10 を選んだときの正しい値（Excel の M10-2 と同じ）です。</p>

      <div class="tbl-wrap"><table class="fs m10-tie"><tr><th>メジャー</th><th>見る場所</th><th>あなたのPower BIの値</th><th>判定</th><th class="n">Excel（M10-2）の値</th></tr>${P.tieout.map(([n, w, u], i) => `<tr><td><b>${n}</b></td><td class="small">${w}（${u}）</td><td><input class="search" type="text" inputmode="decimal" data-tie="${i}" value="${esc(tie[n] || "")}" aria-label="${n}の値"></td><td class="small" id="tj${i}"></td><td class="n">${fmtExp(n)}</td></tr>`).join("")}</table></div>
      <p class="small" id="tjs"></p></div>
    <div class="card"><h2>共有する前の統制チェック</h2><p class="small muted">ダッシュボードの数字にも、コントローラーが責任を持ちます。できているものにチェック。</p>
      <div>${P.controls.map(([t, w], i) => `<label class="sw ${ctl[i] ? "on" : ""}" style="display:flex;margin:6px 0"><input type="checkbox" data-ctl="${i}" ${ctl[i] ? "checked" : ""}><span><b>${t}</b>${w}</span></label>`).join("")}</div><p class="small" id="ctlm"></p></div>
    <div class="card"><h2>やってみよう②：Power BIの用語クイズ（${P.terms.length}問）</h2>${m10SortQ("pbt2", P.terms.map(([s], k) => `<b>Q${k + 1}.</b> ${s}`), P.termsOpts)}</div>
    <div class="card"><h2>作り方の流れ（くわしくは「Power BI練習_手順書.docx」）</h2><ol>${P.steps.map((s) => `<li class="small">${s}</li>`).join("")}</ol>
      <p class="note">Power BI Desktopは無料で使えます（Windows専用。Macでは会社の仮想デスクトップなどを使います）。作ったレポートを社内で共有するには、組織のライセンス（Power BI Pro など）が必要です。使えるかどうかは、会社の情報システム部門に確認してください。メニューの名前は、バージョンによって少しちがうことがあります。</p></div>
    ${mq("営業利益をPower BIで正しく出すメジャーは？", ["Actual = SUM ( Fact_GL[Amount] )", "Actual PL = SUMX ( Fact_GL, Fact_GL[Amount] * RELATED ( Dim_Account[Sign] ) )", "COUNT ( Fact_GL[Amount] )", "AVERAGE ( Fact_GL[Amount] )"], 1, `売上も費用もプラスの金額なので、そのまま足すと ${m10Num(P.noSign)} という意味のない数字になります。Sign を掛けて「利益への影響」で集計します。`)}
    ${mq("給与データを含むダッシュボードを共有するとき、最も大事なことは？", ["きれいな色にする", "行レベルセキュリティ（RLS）などで、見られる人を限定する", "できるだけ多くの人に共有する", "ファイル名を英語にする"], 1, "RLSで閲覧範囲を制限し、共有リンクの範囲も確認します。照合（Tie-out）の記録も残しましょう。なお、RLSが効くのはワークスペースの閲覧者（Viewer）や、アプリ・共有で見る人だけです。管理者・メンバー・共同作成者にはすべて見えるので、ワークスペースのメンバーは最小限にします。")}
    ${cfo("Power BIは「作れる」ことより「正しく運用できる」ことが大切です。毎月の照合、単位と基準の表示、閲覧権限、変更の記録――この4つを押さえれば、作るのが得意な人に任せても安心です。任せる場合でも、照合と権限の確認だけはコントローラーが自分で行いましょう。")}`,

        : n2 ? "Lv2はクリア。次は前年比・累計のDAXと、閲覧権限（RLS）でLv3へ。" : "まずは練習データでLv2（取り込み・モデル・基本のグラフ）を目指しましょう。";
    };
    $$("[data-lv]", root).forEach((c) => c.addEventListener("change", () => { const s = store.get("pbiLv", {}); s[c.dataset.lv] = c.checked; store.set("pbiLv", s); lvMsg(); }));
    lvMsg();
    $("#dax", root).addEventListener("click", (e) => { const b = e.target.closest("[data-dx]"); if (b) m10Copy(b.dataset.dx === "adv" ? M10.daxAdv[1] : M10.dax[+b.dataset.dx][1], $("#daxm", root)); });
    const tj = () => {
      const s = store.get("pbiTie", {});
      let ok = 0, n = 0;
      M10.tieout.forEach(([name, , unit], i) => {
        const inp = $(`[data-tie="${i}"]`, root), el = $("#tj" + i, root);

        if (!inp.value.trim()) { el.innerHTML = ""; return; }

      });
      store.set("pbiTie", s);
      $("#tjs", root).innerHTML = n ? `<b>一致：${ok} / ${M10.tieout.length}</b>${ok === M10.tieout.length ? '　<span class="check-ok">照合完了！ ダッシュボードの数字はExcelと一致しています</span>' : ""}` : "";

    ctlMsg();
    m10BindSortQ(root, "pbt2", M10.terms.length, (k) => M10.terms[k][1], (k) => M10.terms[k][0]);
  } };

function revCalc(p) {
  const hw = (p.price * p.hw_ssp) / (p.hw_ssp + p.saas_ssp), saas = p.price - hw, sm = saas / p.saas_months, jpSm = p.saas_bill / p.saas_months;
  const novCl = p.hw_bill - hw, decCl = novCl + p.saas_bill - sm, commM = p.comm / p.comm_months;
  return { hw, saas, sm, jpSm, novCl, decCl, novAdj: hw - p.hw_bill, decAdj: sm - jpSm, commM, commAdj: p.comm - commM };
}

function cashSvg(res, min) {
  const W = 780, H = 270, L = 64, R = 10, T = 14, B = 36;
  const vals = res.map((x) => x.end);
  const step = 50000;
  const mx = Math.ceil((Math.max(...vals, min) * 1.08) / step) * step, mn = Math.min(0, Math.floor(Math.min(...vals) / step) * step);
  const y = (v) => T + ((mx - v) / (mx - mn)) * (H - T - B);
  const bw = (W - L - R) / res.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="週末の現金残高">`;
  for (let v = mn; v <= mx + 1; v += step) {
    s += `<line class="cb-axis" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text class="cb-txt" x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${f0(v)}</text>`;
  }
  res.forEach((x, i) => {
    const v = x.end, top = y(Math.max(v, 0)), h = Math.abs(y(v) - y(0));
    s += `<rect class="${v < min ? "cb-ng" : "cb-ok"}" x="${L + i * bw + bw * 0.16}" y="${top}" width="${bw * 0.68}" height="${Math.max(h, 1)}" rx="3"><title>${D.cashWeeks[i]}：${f0(v)}</title></rect>`;
    s += `<text class="cb-txt" x="${L + i * bw + bw / 2}" y="${H - B + 16}" text-anchor="middle">${D.cashWeeks[i].replace("週", "")}</text>`;
  });
  s += `<line class="cb-min" x1="${L}" x2="${W - R}" y1="${y(min)}" y2="${y(min)}"/><text class="cb-txt" x="${W - R}" y="${y(min) - 5}" text-anchor="end">最低保有額 ${f0(min)}</text>`;
  return s + "</svg>";
}

const COMP_LESSON = ["close", "gaap", "variance", "tax", "cash", "sod", "audit", "present2", "english", "role"];
function radarSvg(cur, tgt) {
  const n = cur.length, S = 440, c = S / 2, R = 125;
  const pt = (i, v) => { const a = -Math.PI / 2 + (2 * Math.PI * i) / n; return [c + (R * v / 5) * Math.cos(a), c + (R * v / 5) * Math.sin(a)]; };
  let s = `<svg viewBox="0 0 ${S} ${S}" width="100%" style="max-width:420px" role="img" aria-label="自己診断レーダーチャート">`;
  for (let k = 1; k <= 5; k++) s += `<polygon class="rd-grid" points="${Array.from({ length: n }, (_, i) => pt(i, k).join(",")).join(" ")}"/>`;
  for (let i = 0; i < n; i++) { const [x, y] = pt(i, 5); s += `<line class="rd-grid" x1="${c}" y1="${c}" x2="${x}" y2="${y}"/>`; }
  s += `<polygon class="rd-tgt" points="${tgt.map((v, i) => pt(i, v).join(",")).join(" ")}"/>`;
  s += `<polygon class="rd-cur" points="${cur.map((v, i) => pt(i, v).join(",")).join(" ")}"/>`;
  D.comp.forEach(([name], i) => { const [x, y] = pt(i, 6.1); s += `<text class="rd-txt" x="${x}" y="${y}" text-anchor="middle">${name.length > 9 ? name.slice(0, 9) + "…" : name}</text>`; });
  return s + "</svg>";
}

];
